name: Release plugin zip

# `plugin-v*` タグ push で darask-paint 用プラグイン zip を作り GitHub Release
# に添付する。zip は darask-paint.exe と同じ階層の `plugins` フォルダ(または
# 設定で指定したフォルダ)に置くだけで本体が展開・起動する。

on:
  push:
    tags:
      - 'plugin-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      # test-launcher.ps1 は Add-Type -OutputType ConsoleApplication で uv スタブを
      # 作るため Windows PowerShell 5.1 が必要(pwsh 7 では未サポート)。
      - name: Launcher tests
        shell: powershell
        run: ./tests/test-launcher.ps1

      - name: Build plugin zip
        shell: pwsh
        run: |
          $zip = ./package-plugin.ps1 -Version "${{ github.ref_name }}"
          "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
